name: Service CI/CD

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  service:
    uses: PipelineIQproject/pipeline_main/.github/workflows/reusable-node-service-ci.yml@dev
    with:
      service_name: dashboard-api
      image_name: final_capstone-dashboard-api
      dockerfile: services/dashboard-api/Dockerfile
      node_project_dir: services/dashboard-api
      chart_path: dashboard-api
      container_port: "8080"
      smoke_mode: command
      sonar_organization: pipelineiqproject
      sonar_project_key: pipelineiq-dashboard-api
    secrets: inherit
